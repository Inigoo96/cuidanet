# Actualizaciones automáticas: justo lo que vendemos con el Radar de vulnerabilidades
# (dependencias al día y sin versiones desactualizadas).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /herramientas/ci
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      herramientas-ci:
        patterns: ["*"]
